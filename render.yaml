# Render blueprint for the OKORO FX backend.
#
# IMPORTANT -- how migrations actually get applied:
#
# Render only supports a *pre-deploy* command on **paid** web services. On the
# free plan the pre-deploy command is silently ignored, so a blueprint that
# relies on it alone ships a schema that is one release behind the code --
# exactly the "relation \"kyc_kycprofile\" does not exist" outage this file
# used to cause. The migration therefore runs in the *start* command, which
# every plan honours, and the pre-deploy command is kept as well so a paid
# plan applies the migrations before the new instance starts serving.
#
# The health check path makes Render hold traffic back from a release whose
# schema is behind, instead of routing users into 500s.
services:
  - type: web
    name: okoro-fx-backend-app
    runtime: python
    plan: free
    healthCheckPath: /api/health
    # "bash build.sh" rather than "./build.sh": the executable bit is not
    # preserved on every checkout, and a build that cannot start would fail
    # the deploy before it even reaches the migrations.
    #
    # NOTE: this is the *default* for a Blueprint-managed service. A service
    # created by hand in the dashboard ignores this file and uses whatever is
    # typed into Settings -> Build Command (Render's fallback is
    # "pip install -r requirements.txt"). Either way build.sh is what should
    # run; the start command below is what actually guarantees migrate.
    buildCommand: bash build.sh
    # Honoured on paid plans only; harmless (idempotent) everywhere else.
    preDeployCommand: python manage.py migrate --noinput
    # Every plan: apply the migrations, then serve.
    #
    # This is belt-and-braces. The real guarantee lives in backend/wsgi.py,
    # which calls backend.startup.migrate_on_startup() -- that runs no matter
    # what this file says, because the platform runs "gunicorn backend.wsgi"
    # and gunicorn imports that exact module. A service created by hand in the
    # dashboard ignores render.yaml entirely (which is precisely how the
    # "kyc_kycprofile does not exist" outage happened), so nothing here may be
    # the only path to a migrated schema.
    #
    # gunicorn, not daphne: the live service already runs "gunicorn
    # backend.wsgi" and starts cleanly, so switching servers is a needless
    # variable during an outage.
    startCommand: sh -c "echo '==> Applying migrations' && python manage.py migrate --noinput && echo '==> Starting gunicorn' && exec gunicorn backend.wsgi"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: KYC_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Discord alerting. Leave sync:false so the webhook is entered in the
      # dashboard and never committed to the repository.
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_ACTIVITY_WEBHOOK_URL
        sync: false
      - key: DISCORD_ALERTS_ENABLED
        value: "true"
      - key: APP_ENV
        value: "production"
